<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite CSS Solar System</title>
    <style>
      /* --- General Setup --- */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("https://media.gettyimages.com/id/1514138928/video/flying-through-stars-and-nebula-stock-video.jpg?s=640x640&k=20&c=ZwAPj1tvj08nwtSjoEdxQq1sLAsTtfuzFTl3WzesUnM=");
        background-size: cover;
        backdrop-filter: blur(1px);
        overflow: hidden; /* Hide scrollbars */
        font-family: sans-serif;
      }

      /* --- Solar System Container --- */
      .solar-system {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* --- The Sun --- */
      .sun {
        position: absolute;
        width: 60px;
        height: 60px;
        background-image: url("https://images.nationalgeographic.org/image/upload/t_edhub_resource_key_image/v1638882786/EducationHub/photos/sun-blasts-a-m66-flare.jpg");
        background-size: 89px;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: 50%;
        box-shadow: 0 0 14px #f57f17;
        z-index: 10;
      }

      /* --- Common Orbit Styles --- */
      .orbit {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        /* Centering the orbit */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: spin infinite linear;
      }

      /* --- Common Planet Styles --- */
      .planet {
        position: absolute;
        border-radius: 50%;
        /* Place planet on the orbit line (top-center) */
        top: -50%;
        left: 50%;
        transform: translate(-50%, -50%); /* Center on the line */
        box-shadow: inset -2px -2px 5px rgba(0, 0, 0, 0.5); /* Shadow for 3D effect */
      }

      /* --- Specific Planetary Orbits & Sizes --- */

      /* Mercury */
      .orbit-mercury {
        width: 100px;
        height: 100px;
        animation-duration: 4s;
      }
      .mercury {
        width: 10px;
        height: 10px;
        background-image: url("https://media-cldnry.s-nbcnews.com/image/upload/msnbc/Components/Photo_StoryLevel/080114/080114-mercury-hmed-10a.jpg");
        background-size: 35px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px; /* Adjusting position to sit on line */
      }

      /* Venus */
      .orbit-venus {
        width: 150px;
        height: 150px;
        animation-duration: 7s;
      }
      .venus {
        width: 14px;
        height: 14px;
        background-image: url("https://svs.gsfc.nasa.gov/vis/a010000/a013600/a013640/venus_thumb.jpg");
        background-size: 35px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
      }

      /* Earth */
      .orbit-earth {
        width: 210px;
        height: 210px;
        animation-duration: 12s;
      }
      .earth {
        width: 16px;
        height: 16px;
        background-image: url("https://cdn.mos.cms.futurecdn.net/FaWKMJQnr2PFcYCmEyfiTm-1200-80.jpg");
        background-size: 29px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
      }
      /* Moon (Child of Earth) */
      .moon-orbit {
        position: absolute;
        width: 30px;
        height: 30px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        animation: spin 2s infinite linear;
      }
      .moon {
        width: 4px;
        height: 4px;
        background: #ddd;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        position: absolute;
        top: -2px;
        left: 50%;
        transform: translate(-50%, 0);
        border-radius: 50%;
      }

      /* Mars */
      .orbit-mars {
        width: 270px;
        height: 270px;
        animation-duration: 20s;
      }
      .mars {
        width: 12px;
        height: 12px;
        background-image: url("https://c8.alamy.com/zooms/9/00941c947fe940e7a252b71f398bf582/2c56yea.jpg");
        background-size: 13px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
      }

      /* Jupiter */
      .orbit-jupiter {
        width: 380px;
        height: 380px;
        animation-duration: 35s;
      }
      .jupiter {
        width: 30px;
        height: 30px;
        background-size: 51px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
        background-image: url("https://cdn.esahubble.org/archives/images/screen/heic1914a.jpg");
      }

      /* Saturn */
      .orbit-saturn {
        width: 500px;
        height: 500px;
        animation-duration: 50s;
      }
      .saturn {
        width: 38px;
        height: 49px;
        background-image: url("saturn.PNG");
        background-size: 31px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
      }

      /* Uranus */
      .orbit-uranus {
        width: 600px;
        height: 600px;
        animation-duration: 70s;
      }
      .uranus {
        width: 18px;
        height: 18px;
        background: url("https://www.andrews.edu/~dominickt/PicturesOfPlanets/uranus1.jpg");
        background-size: 30px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
      }

      /* Neptune */
      .orbit-neptune {
        width: 700px;
        height: 700px;
        animation-duration: 90s;
      }
      .neptune {
        width: 18px;
        height: 18px;
        background: url("https://cdn.mos.cms.futurecdn.net/PezBzd9Fehsq9XWgWMauVV.jpg");
        background-size: 41px;
        background-repeat: no-repeat;
        background-position: center;
        top: 0px;
      }

      /* --- Animation Keyframes --- */
      @keyframes spin {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* Mobile Responsiveness */
      /* 📱 Mobile Responsiveness */
      @media (max-width: 768px) {
        body {
          overflow: hidden;
        }

        .solar-system {
          transform: scale(0.55);
        }

        .sun {
          width: 40px;
          height: 40px;
        }

        .orbit-mercury {
          width: 70px;
          height: 70px;
        }
        .orbit-venus {
          width: 110px;
          height: 110px;
        }
        .orbit-earth {
          width: 150px;
          height: 150px;
        }
        .orbit-mars {
          width: 190px;
          height: 190px;
        }
        .orbit-jupiter {
          width: 260px;
          height: 260px;
        }
        .orbit-saturn {
          width: 340px;
          height: 340px;
        }
        .orbit-uranus {
          width: 420px;
          height: 420px;
        }
        .orbit-neptune {
          width: 500px;
          height: 500px;
        }

        .mercury {
          width: 7px;
          height: 7px;
        }
        .venus {
          width: 10px;
          height: 10px;
        }
        .earth {
          width: 12px;
          height: 12px;
        }
        .mars {
          width: 10px;
          height: 10px;
        }
        .jupiter {
          width: 22px;
          height: 22px;
        }
        .saturn {
          width: 46px;
          height: 34px;
        }
        .uranus {
          width: 14px;
          height: 14px;
        }
        .neptune {
          width: 14px;
          height: 14px;
        }

        .moon-orbit {
          width: 20px;
          height: 20px;
        }

        .moon {
          width: 3px;
          height: 3px;
        }
      }
    </style>
  </head>
  <body>
    <div class="solar-system">
      <div class="sun"></div>

      <div class="orbit orbit-mercury">
        <div class="planet mercury"></div>
      </div>

      <div class="orbit orbit-venus">
        <div class="planet venus"></div>
      </div>

      <div class="orbit orbit-earth">
        <div class="planet earth">
          <div class="moon-orbit">
            <div class="moon"></div>
          </div>
        </div>
      </div>

      <div class="orbit orbit-mars">
        <div class="planet mars"></div>
      </div>

      <div class="orbit orbit-jupiter">
        <div class="planet jupiter"></div>
      </div>

      <div class="orbit orbit-saturn">
        <div class="planet saturn"></div>
      </div>

      <div class="orbit orbit-uranus">
        <div class="planet uranus"></div>
      </div>

      <div class="orbit orbit-neptune">
        <div class="planet neptune"></div>
      </div>
    </div>
  </body>
</html>
